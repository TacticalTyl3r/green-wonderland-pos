name: Static site integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Verify POS assets and module syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate active website modules and assets
        run: node scripts/check-static-site.mjs
